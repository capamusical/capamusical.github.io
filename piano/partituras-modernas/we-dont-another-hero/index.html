    <!-- fallback CSS manual para evitar el mensaje -->
    <style>
    .abcjs-css-warning {
    display: none !important;
    }

        .abcjs-inline-audio {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 12px;
            margin: 20px auto;
            max-width: 800px;
            border: 1px solid #ccc;
            border-radius: 8px;
            background: #f8f8f8;
        }

        .abcjs-inline-audio button {
            cursor: pointer;
            border: 1px solid #ccc;
            background: white;
            border-radius: 4px;
            padding: 6px 10px;
        }

        .abcjs-inline-audio .abcjs-midi-progress-background {
            flex: 1;
            height: 10px;
            background: #ddd;
            border-radius: 5px;
            overflow: hidden;
            position: relative;
        }

        .abcjs-inline-audio .abcjs-midi-progress-indicator {
            height: 100%;
            background: #4285f4;
            width: 0%;
        }
        #paper {
    margin-top: 50px;
}
    </style>
</head>

<body>
    <header>
        <nav class="container">
            <div class="logo">
                <a href="/index.html">
                    <img src="/imagenes/logo_vector.png" alt="CapaMusical Logo">
                </a>
                <span>CapaMusical</span>
            </div>
            <ul class="nav-links">
                <li><a href="/composicion.html">Composición</a></li>
                <li><a href="/armonia.html">Armonía</a></li>
                <li><a href="/pianomoderno.html">Piano</a></li>
                <li><a href="/aplicacion.html">Aplicación</a></li>
                <li><a href="/musical.html" target="_blank">Musical</a></li>
            </ul>
            <div class="menu-toggle">
                <span></span>
                <span></span>
                <span></span>
            </div>
        </nav>
    </header>

    <main>
        <h1 style="display: none;">We dont another Hero</h1>

        <div style="display:flex; justify-content:center;">
            <div id="paper"></div>
        </div>

        <div id="audio"></div>
    </main>

        <!-- Footer Section -->
        <footer>
            <p style="text-align: center;">&copy; 2024 CapaMusical. Todos los derechos reservados.</p>
            <div class="social-links">
                <a href="https://www.facebook.com/capamusical" target="_blank">
                    <img src="/imagenes/icons8-facebook-32.png" alt="Twitter" style="width:24px; height:24px;">
                <a href="https://www.instagram.com/capamusical" target="_blank">
                    <img src="/imagenes/icons8-instagram-32.png" alt="Instagram" style="width:24px; height:24px;"></a>
                <a href="https://www.twitter.com/capamusical" target="_blank">
                    <img src="/imagenes/icons8-twitterx-32.png" alt="Twitter" style="width:24px; height:24px;"></a>
            </div>
        </footer>

    <script>
        // menú móvil
        const menuToggle = document.querySelector('.menu-toggle');
        const navLinks = document.querySelector('.nav-links');

        menuToggle.addEventListener('click', () => {
            navLinks.classList.toggle('active');
        });
    </script>

    <script>
        const abcString = `X:1
T: We dont another Hero 
M: 4/4
L: 1/8
Q:1/4=104
K:C
V:1
y y Z8 |: !segno! \
 z4 A,C ED-| DE3 z4| z4 A,C ED-|DB,/A,/G,2 z4|
z4 A,C ED-| \
D2 CB,- B,2 G,A,-| \
A,4 z4 |1  z8 y :|2 z6 A,B, || 
C2 A,2 z3 C| \
[M:2/4] B,A, G,2 | [M:4/4] D,8| z6 A,B,|
C2 A,G, A,2 zC-| \
[M:2/4] B,A, G,2 !coda!  || [M:4/4] y A,8 y y | 
"^Estribillo" z2 BB cc BB | \
A3G- G4| \
z2 BB cc BB | \
c3B- BA/G/-G2|
z2 BB cc BB | \
A3G- G2 DE| \
F4 z4 | z8  !D.S.! y y ||
!coda!  y A,8 y y | z4 DDDD | D2 "^Estribillo" BB cc BB | \
A3G- G4| 
z2 BB cc BB | \
c3B- BA/G/-G2|
z2 BB cc BB | \
A3G- G2 DE| \
F4 z4 | 
[K:F] z4 dc Bd-| dd/2c/2 d/2c/2B z4| \
z2 z<d  (3d2c2B2 | \
AG z4> | \
z4 z/ G/B  B4|
c3B/A/ G/A/G  z2| \
z3A BA cc| \
z3B/2c/2 dd  dd/2c/2| \
B2 z6 ||
"^Solo Guitarra" y y y y  Z8 || "^Estribillo" z2 BB cc BB | \
AG z A G2 z2| \
z2 BB cc BB | \
c3B- BA/G/-G2|
z2 BB cc BB | \
A3G- G2 GF| \
GG z6 | z8  ||
z4 DDDD | "^Estribillo" D2  BB cc BB | \
A3G- G4| 
z2 BB cc BB | \
c3B- BA/G/-G2|
z2 BB cc BB | \
A3G- G2 DE| \
()F8 | d8) |]`;

        const visualObj = ABCJS.renderAbc("paper", abcString, {
    responsive: "resize"
})[0];

        const synth = new ABCJS.synth.CreateSynth();
        const control = new ABCJS.synth.SynthController();

        control.load("#audio", null, {
            displayPlay: true,
            displayProgress: true,
            displayRestart: true,
            displayLoop: true,
            displayWarp: true
        });

        control.disable(true);

        synth.init({ visualObj: visualObj }).then(() => {
            synth.prime().then(() => {
                control.setTune(visualObj, false).then(() => {
                    control.disable(false);
                });
            });
        });

        // activar audio en primer click
        document.querySelector("#audio").addEventListener("click", () => {
            control.activateAudio();
        }, { once: true });
    </script>
</body>
</html>
