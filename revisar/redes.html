<html><head><base href="https://cdn.example.com/social-widget/">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Widget de Redes Sociales Mejorado</title>
<style>
  body {
    font-family: Arial, sans-serif;
    background-color: #f0f0f0;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    margin: 0;
  }
  #redes {
    background-color: white;
    border-radius: 10px;
    box-shadow: 0 0 10px rgba(0,0,0,0.1);
    overflow: hidden;
    width: 400px;
    height: 600px;
  }
  .tab-container {
    display: flex;
    background-color: #f8f8f8;
    overflow-x: auto;
    white-space: nowrap;
  }
  .tab {
    padding: 10px 15px;
    cursor: pointer;
    transition: background-color 0.3s;
    font-size: 14px;
  }
  .tab:hover {
    background-color: #e0e0e0;
  }
  .tab.active {
    background-color: white;
    border-bottom: 2px solid #1da1f2;
  }
  .content {
    display: none;
    padding: 10px;
    height: calc(100% - 50px);
    overflow-y: auto;
  }
  .content.active {
    display: block;
  }
  iframe {
    width: 100%;
    height: 100%;
    border: none;
  }
</style>
</head>
<body>
  <div id="redes">
    <div class="tab-container">
      <div class="tab active" data-tab="youtube">YouTube</div>
      <div class="tab" data-tab="instagram">Instagram</div>
      <div class="tab" data-tab="tiktok">TikTok</div>
    </div>
    <div class="content active" id="youtube">
      <iframe src="https://www.youtube.com/embed/DzADfkvW6wo?si=icW5oWC0hQUwopR1" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
    </div>
    <div class="content" id="instagram">
      <blockquote class="instagram-media" data-instgrm-permalink="https://www.instagram.com/soyalfredogoncalves/" data-instgrm-version="14" style="max-width:100%; min-width:326px;"></blockquote>
    </div>
    <div class="content" id="tiktok">
      <blockquote class="tiktok-embed" cite="https://www.tiktok.com/@capamusical.com" data-unique-id="capamusical" data-embed-type="creator" style="max-width: 100%; min-width: 326px;">
        <section> <a target="_blank" href="https://www.tiktok.com/@capamusical.com">@youtube</a> </section>
      </blockquote>
    </div>
  </div>

  <script async src="https://www.instagram.com/embed.js"></script>
  <script async src="https://www.tiktok.com/embed.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const tabs = document.querySelectorAll('.tab');
      const contents = document.querySelectorAll('.content');

      tabs.forEach(tab => {
        tab.addEventListener('click', () => {
          const tabId = tab.getAttribute('data-tab');
          
          tabs.forEach(t => t.classList.remove('active'));
          contents.forEach(c => c.classList.remove('active'));
          
          tab.classList.add('active');
          document.getElementById(tabId).classList.add('active');
        });
      });
    });
  </script>
</body></html>
