<html><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Widget de Redes Sociales</title>
<style>
  body {
    font-family: Arial, sans-serif;
    background-color: #f0f0f0;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    margin: 0;
  }
  #redes {
    background-color: white;
    border-radius: 10px;
    box-shadow: 0 0 10px rgba(0,0,0,0.1);
    overflow: hidden;
    width: 90%;
    max-width: 1000px;
  }
  .tab-container {
    display: flex;
    background-color: #f8f8f8;
  }
  .tab {
    padding: 10px 20px;
    cursor: pointer;
    transition: background-color 0.3s;
  }
  .tab:hover {
    background-color: #e0e0e0;
  }
  .tab.active {
    background-color: white;
    border-bottom: 2px solid #1da1f2;
  }
  .content {
    display: none;
    padding: 20px;
  }
  .content.active {
    display: block;
  }
  iframe {
    width: 100%;
    height: 500px;
    border: none;
  }
</style>
</head>
<body>
  <div id="redes">
    <div class="tab-container">
      <div class="tab active" data-tab="youtube">YouTube</div>
      <div class="tab" data-tab="twitter">Twitter</div>
      <div class="tab" data-tab="instagram">Instagram</div>
    </div>
    <div class="content active" id="youtube">
      <iframe src="https://www.youtube.com/embed/DzADfkvW6wo?si=icW5oWC0hQUwopR1" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
    </div>
    <div class="content" id="patreon">
      <a class="twitter-timeline" href="https://x.com/Capa_Musical"></a>
    </div>
    <div class="content" id="instagram">
      <blockquote class="instagram-media" data-instgrm-permalink="https://www.instagram.com/soyalfredogoncalves/" data-instgrm-version="14"></blockquote>
    </div>
  </div>

  <script src="https://platform.twitter.com/widgets.js" charset="utf-8"></script>
  <script async src="https://www.instagram.com/embed.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const tabs = document.querySelectorAll('.tab');
      const contents = document.querySelectorAll('.content');

      tabs.forEach(tab => {
        tab.addEventListener('click', () => {
          const tabId = tab.getAttribute('data-tab');
          
          tabs.forEach(t => t.classList.remove('active'));
          contents.forEach(c => c.classList.remove('active'));
          
          tab.classList.add('active');
          document.getElementById(tabId).classList.add('active');
        });
      });
    });
  </script>
</body></html>
