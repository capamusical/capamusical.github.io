<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generador de Acordes</title>
    <link rel="stylesheet" href="/armonia/Capa-app/styles.css">
</head>
<header>
    <nav class="container">
        <div class="logo">
            <a href="/index.html">
                <img src="/imagenes/logo_vector.png" alt="CapaMusical Logo">
            </a>
            <span>CapaMusical</span>
        </div>
        <ul class="nav-links">
            <li><a href="/composicion.html"></a></li>
        </ul>
        <div class="menu-toggle">
            <span></span>
            <span></span>
            <span></span>
        </div>
    </nav>
</header>
<body>
    <div class="container">
        <h1>CAPAmusicAPP</h1>
        <h2>Armonizador automatico para Do Mayor</h2>
        <div class="input-group">
            <label for="sub-nota">Nota para Subdominante (sub):</label>
            <input type="text" id="sub-nota">
            <button onclick="generarSub()">Generar</button>
        </div>
        <div id="sub-result"></div>

        <div class="input-group">
            <label for="dom-nota">Nota para Dominante (dom):</label>
            <input type="text" id="dom-nota">
            <button onclick="generarDom()">Generar</button>
        </div>
        <div id="dom-result"></div>

        <div class="input-group">
            <label for="ton-nota">Nota para Tónica (ton):</label>
            <input type="text" id="ton-nota">
            <button onclick="generarTon()">Generar</button>
        </div>
        <div id="ton-result"></div>
    </div>
    <script src="/armonia/Capa-app/script.js"></script>
</body>
</html>
